name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  # Which images this push or pull request changes. The runner images are rebuilt only when
  # image/ changes, the controller only when the Go code or its Dockerfile changes; this workflow
  # changing, a version tag, or a push with no usable base rebuilds all three.
  changes:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.diff.outputs.runner }}
      controller: ${{ steps.diff.outputs.controller }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BEFORE}"
          if [ "${EVENT}" = pull_request ]; then base="${PR_BASE}"; fi
          if [ "${REF_TYPE}" = tag ] || [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "runner=true" >>"$GITHUB_OUTPUT"; echo "controller=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "${base}" HEAD)"
          echo "${files}"
          all=false
          if echo "${files}" | grep -qx '.github/workflows/ci.yml'; then all=true; fi
          runner=false; controller=false
          if [ "${all}" = true ] || echo "${files}" | grep -q '^image/'; then runner=true; fi
          if [ "${all}" = true ] || echo "${files}" | grep -qE '^(cmd/|internal/|go\.mod$|go\.sum$|Dockerfile$|\.dockerignore$)'; then controller=true; fi
          echo "runner=${runner}" >>"$GITHUB_OUTPUT"
          echo "controller=${controller}" >>"$GITHUB_OUTPUT"

  # Images are named after the repository, so a fork publishes its own. A push to main publishes
  # the sha tag; a vX.Y.Z tag also publishes runner :vX.Y.Z, :pg-vX.Y.Z, :php-vX.Y.Z and controller :vX.Y.Z.
  # Layers are cached per target, so an unchanged stage keeps its layer digests.
  images:
    runs-on: ubuntu-latest
    needs: [test, changes]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {name: runner, kind: runner, context: image, target: base, image: '', prefix: ''}
          - {name: runner-pg, kind: runner, context: image, target: pg, image: '', prefix: 'pg-'}
          - {name: runner-sudo, kind: runner, context: image, target: sudo, image: '', prefix: 'sudo-'}
          - {name: runner-redis, kind: runner, context: image, target: redis, image: '', prefix: 'redis-'}
          - {name: runner-php, kind: runner, context: image, target: php, image: '', prefix: 'php-'}
          - {name: controller, kind: controller, context: ., target: '', image: '-controller', prefix: ''}
    steps:
      - id: want
        env:
          RUNNER: ${{ needs.changes.outputs.runner }}
          CONTROLLER: ${{ needs.changes.outputs.controller }}
          KIND: ${{ matrix.kind }}
        run: |
          if { [ "${KIND}" = runner ] && [ "${RUNNER}" = true ]; } || { [ "${KIND}" = controller ] && [ "${CONTROLLER}" = true ]; }; then
            echo "build=true" >>"$GITHUB_OUTPUT"
          else
            echo "build=false" >>"$GITHUB_OUTPUT"; echo "unchanged: ${KIND} image not rebuilt"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.want.outputs.build == 'true'
      - id: tags
        if: steps.want.outputs.build == 'true'
        env:
          REPO: ${{ github.repository }}
          SUFFIX: ${{ matrix.image }}
          PREFIX: ${{ matrix.prefix }}
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          name="ghcr.io/${REPO,,}${SUFFIX}"
          {
            echo "tags<<EOF"
            echo "${name}:${PREFIX}${SHA}"
            if [ "${REF_TYPE}" = tag ]; then echo "${name}:${PREFIX}${REF_NAME}"; fi
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.want.outputs.build == 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: steps.want.outputs.build == 'true' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: steps.want.outputs.build == 'true'
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          # the pg stage builds on base, so it also reads the base image's cache
          cache-from: |
            type=gha,scope=${{ matrix.name }}
            type=gha,scope=runner
          # only pushes write the cache: a pull request's cache is not readable from main and would
          # only use up the repository's cache space
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}

  # The derived-image example builds on the latest release, the way a user would build theirs; it is
  # never pushed.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: examples/derived
          platforms: linux/amd64
          push: false

  # Builds the php target and checks every PHP version it ships, Composer and `use-php` as the runner
  # user (the image exists because setup-php cannot run without sudo, #38). Not pushed.
  php-variant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: image
          target: php
          platforms: linux/amd64
          load: true
          tags: runner-php-smoke:ci
      - name: use-php picks each version
        run: |
          for v in 8.3 8.4 8.5; do
            docker run --rm --entrypoint bash runner-php-smoke:ci -c "id -un | grep -qx runner && RUNNER_TEMP=/tmp use-php $v | grep -q 'PHP $v\.' && composer --version >/dev/null"
          done

  # Builds the pg target for the default major and for another major with an extension, and runs
  # image/smoke-pg.sh in each as the runner user (ci-postgres start, the major, CREATE EXTENSION).
  # Not pushed: these are checks of the build args, not published variants.
  pg-variants:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {major: '18', version: '', extensions: '', check: ''}
          - {major: '16', version: '16.15-1.pgdg24.04+2', extensions: 'postgresql-16-partman=5.5.0-1.pgdg24.04+1', check: 'pg_partman'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: args
        env:
          MAJOR: ${{ matrix.major }}
          VERSION: ${{ matrix.version }}
          EXTENSIONS: ${{ matrix.extensions }}
        run: |
          {
            echo "build-args<<EOF"
            if [ -n "${VERSION}" ]; then echo "PG_MAJOR=${MAJOR}"; echo "PG_VERSION=${VERSION}"; fi
            if [ -n "${EXTENSIONS}" ]; then echo "PG_EXTENSIONS=${EXTENSIONS}"; fi
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: image
          target: pg
          platforms: linux/amd64
          load: true
          tags: runner-pg-smoke:${{ matrix.major }}
          build-args: ${{ steps.args.outputs.build-args }}
      - name: Smoke test
        env:
          MAJOR: ${{ matrix.major }}
          CHECK: ${{ matrix.check }}
        run: |
          # shellcheck disable=SC2086 # CHECK is a space-separated list of extensions
          docker run --rm -v "$PWD/image/smoke-pg.sh:/tmp/smoke-pg.sh:ro" --entrypoint bash \
            "runner-pg-smoke:${MAJOR}" /tmp/smoke-pg.sh "${MAJOR}" ${CHECK}

  # Builds the redis target and the pg target with REDIS_VERSION, and runs image/smoke-redis.sh in
  # each as the runner user (ci-redis start, SET/GET, stop). Not pushed.
  redis-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {target: redis, args: ''}
          - {target: pg, args: 'REDIS_VERSION=6:8.10.2-1rl1~noble1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: image
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: runner-redis-smoke:${{ matrix.target }}
          build-args: ${{ matrix.args }}
      - name: Smoke test
        env:
          TARGET: ${{ matrix.target }}
        run: docker run --rm -v "$PWD/image/smoke-redis.sh:/tmp/smoke-redis.sh:ro" --entrypoint bash "runner-redis-smoke:${TARGET}" /tmp/smoke-redis.sh
